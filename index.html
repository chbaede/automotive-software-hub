<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Search Engine SEO Meta Tags -->
    <title>Automotive Software Hub — Interactive SDV, AUTOSAR, QNX & Yocto Developer Portal</title>
    <meta name="description" content="Open reference portal and interactive developer tools for automotive software engineers, SDV developers, embedded Linux/Yocto engineers, AUTOSAR specialists, and QNX professionals. Explore CAN, SOME/IP, DoIP, ISO 26262, and automotive technology stacks." />
    <meta name="keywords" content="Automotive Software, Software Defined Vehicle, SDV, AUTOSAR Classic, AUTOSAR Adaptive, Android Automotive OS, AAOS, Yocto Project, QNX Neutrino, CAN FD, SOME/IP, DoIP, UDS ISO 14229, ISO 26262, ISO 21434, Automotive Ethernet, Embedded Linux, dSPACE HIL, NVIDIA DriveWorks, CARLA" />
    <meta name="author" content="Changhyeok Bae" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://chbaede.github.io/automotive-software-hub/" />

    <!-- Open Graph / Facebook / LinkedIn Social Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chbaede.github.io/automotive-software-hub/" />
    <meta property="og:title" content="Automotive Software Hub — Interactive SDV, AUTOSAR & Yocto Developer Portal" />
    <meta property="og:description" content="Interactive map of modern vehicle software stacks, in-browser CAN/SOME/IP developer utilities, standards, open-source projects, and industry directory." />
    <meta property="og:site_name" content="Automotive Software Hub" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Automotive Software Hub — SDV & AUTOSAR Developer Portal" />
    <meta name="twitter:description" content="Interactive automotive software stack map, in-browser protocol tools, resources, events, and industry directory." />

    <!-- Structured Data: JSON-LD (Schema.org) for Google Indexing -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Automotive Software Hub",
        "alternateName": "Automotive Software Developer Portal",
        "url": "https://chbaede.github.io/automotive-software-hub/",
        "description": "Essential developer tools, documentation, open-source projects, events, and industry reference directory for automotive software developers, embedded Linux engineers, AUTOSAR engineers, and SDV professionals.",
        "publisher": {
          "@type": "Organization",
          "name": "Automotive Software Hub",
          "url": "https://github.com/chbaede/automotive-software-hub"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://chbaede.github.io/automotive-software-hub/resources?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-brand-500 selection:text-white dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
